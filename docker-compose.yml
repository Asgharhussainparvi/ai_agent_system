# ╔══════════════════════════════════════════════════════════════════╗
# ║  docker-compose.yml — Autonomous AI Content System              ║
# ╚══════════════════════════════════════════════════════════════════╝

version: "3.9"

services:

  # ── Main API + Pipeline server ────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ai-content-system:latest
    container_name: ai_content_api
    restart: unless-stopped

    # GPU support (requires nvidia-container-toolkit on host)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - ./outputs:/app/outputs
      - hf_cache:/home/user/.cache/huggingface

    environment:
      - OUTPUT_DIR=/app/outputs
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - PYTHONUNBUFFERED=1

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── Auto-scrape scheduler ─────────────────────────────────────────────────
  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ai-content-system:latest
    container_name: ai_content_scheduler
    restart: unless-stopped

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    env_file:
      - .env

    volumes:
      - ./outputs:/app/outputs
      - hf_cache:/home/user/.cache/huggingface

    environment:
      - OUTPUT_DIR=/app/outputs
      - PYTHONUNBUFFERED=1

    command: ["python", "scheduler.py"]

    depends_on:
      api:
        condition: service_healthy

volumes:
  hf_cache:
    driver: local
